name: Offline Python verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          check-latest: false
      - run: python -m permissioned_research doctor
      - run: python -m evaluation.evaluate --verify-freeze
      - run: python -m unittest discover -s tests -v
      - run: python -m permissioned_research demo --scenario vendor-review --principal priya --provider scripted --state-dir .local/ci-demo
      - run: python -m evaluation.evaluate --split heldout --providers scripted,baseline --repeat 1 --output .local/ci-evaluation.json
      - run: python -m evaluation.evaluate --verify-corruptions --output .local/ci-controls.json
      - run: python -m evaluation.release_check --run --output .local/ci-release.json
